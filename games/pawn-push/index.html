<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawn Push</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --light: #CAF0F8;
      --dark:  #1B263B;
      --board-light: #e8d5b0;
      --board-dark:  #8b6340;
      --white-pawn: #F8F9FA;
      --black-pawn: #0D1B2A;
      --highlight:  rgba(58,134,255,0.45);
      --capture:    rgba(255,107,107,0.55);
      --accent:     #FFD166;
      --win-bg:     #1B263B;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--light);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* ── Layout ── */
    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .turn-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--light);
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    .turn-pip {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      transition: background 0.2s;
    }

    /* ── Board ── */
    .board-wrap {
      position: relative;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border: 3px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      overflow: hidden;
      width: min(90vw, 360px);
      aspect-ratio: 1;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .cell {
      position: relative;
      cursor: pointer;
      transition: filter 0.1s;
    }

    .cell:hover { filter: brightness(1.1); }

    .cell.light { background: var(--board-light); }
    .cell.dark  { background: var(--board-dark); }

    /* selection / move hints */
    .cell.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--highlight);
    }

    .cell.can-move::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--highlight);
    }

    .cell.can-capture::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--capture);
    }

    /* ── Pawn SVG ── */
    .pawn {
      position: absolute;
      inset: 8%;
      z-index: 1;
      transition: transform 0.15s ease;
      pointer-events: none;
    }

    .cell:hover .pawn { transform: scale(1.08); }

    /* ── Status bar ── */
    .status {
      font-size: 0.8rem;
      color: rgba(202,240,248,0.6);
      letter-spacing: 0.05em;
      min-height: 1.2em;
      text-align: center;
    }

    /* ── Restart button ── */
    .btn-restart {
      background: transparent;
      border: 1px solid rgba(202,240,248,0.25);
      color: rgba(202,240,248,0.6);
      padding: 0.4rem 1rem;
      border-radius: 5px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-restart:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Win overlay ── */
    .win-overlay {
      position: absolute;
      inset: 0;
      background: rgba(27,38,59,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 10;
    }

    .win-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .win-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .win-sub {
      font-size: 0.85rem;
      color: rgba(202,240,248,0.7);
      letter-spacing: 0.05em;
    }

    .btn-play-again {
      margin-top: 0.5rem;
      background: var(--accent);
      color: var(--dark);
      border: none;
      padding: 0.55rem 1.5rem;
      border-radius: 5px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-play-again:hover { opacity: 0.85; }
  </style>
</head>
<body>

<div class="game-wrap">
  <div class="header">
    <span class="title">Pawn Push</span>
    <div class="turn-badge">
      <div class="turn-pip" id="turnPip"></div>
      <span id="turnLabel">White's Turn</span>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="win-overlay" id="winOverlay">
      <div class="win-title" id="winTitle"></div>
      <div class="win-sub">reached the other side</div>
      <button class="btn-play-again" id="btnPlayAgain">Play Again</button>
    </div>
  </div>

  <div class="status" id="status">Click a pawn to select it</div>
  <button class="btn-restart" id="btnRestart">↺ Restart</button>
</div>

<script>
  // ─────────────────────────────────────────
  //  GAME STATE
  // ─────────────────────────────────────────
  const ROWS = 6;
  const COLS = 6;

  // 0 = empty, 1 = white pawn, 2 = black pawn
  let board = [];
  let currentPlayer = 1; // 1 = white (moves up, starts bottom), 2 = black (moves down, starts top)
  let selected = null;   // { row, col } of selected pawn
  let validMoves = [];   // array of { row, col, capture }
  let gameOver = false;

  function initBoard() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    // Black pawns on row 0 (top)
    for (let c = 0; c < COLS; c++) board[0][c] = 2;
    // White pawns on row ROWS-1 (bottom)
    for (let c = 0; c < COLS; c++) board[ROWS - 1][c] = 1;
    currentPlayer = 1;
    selected = null;
    validMoves = [];
    gameOver = false;
  }

  // ─────────────────────────────────────────
  //  MOVE LOGIC
  // ─────────────────────────────────────────

  // White moves UP (row decreases), Black moves DOWN (row increases)
  function getDirection(player) {
    return player === 1 ? -1 : 1;
  }

  function getMovesForPawn(row, col, player) {
    const dir = getDirection(player);
    const moves = [];

    // Forward move
    const fRow = row + dir;
    if (fRow >= 0 && fRow < ROWS && board[fRow][col] === 0) {
      moves.push({ row: fRow, col, capture: false });
    }

    // Diagonal captures
    for (const dc of [-1, 1]) {
      const cCol = col + dc;
      if (cCol >= 0 && cCol < COLS && fRow >= 0 && fRow < ROWS) {
        const target = board[fRow][cCol];
        const opponent = player === 1 ? 2 : 1;
        if (target === opponent) {
          moves.push({ row: fRow, col: cCol, capture: true });
        }
      }
    }

    return moves;
  }

  function hasAnyMove(player) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c] === player && getMovesForPawn(r, c, player).length > 0) {
          return true;
        }
      }
    }
    return false;
  }

  function checkWin(player) {
    // White wins by reaching row 0, Black wins by reaching row ROWS-1
    const goalRow = player === 1 ? 0 : ROWS - 1;
    for (let c = 0; c < COLS; c++) {
      if (board[goalRow][c] === player) return true;
    }
    // Also win if opponent has no pawns left
    const opponent = player === 1 ? 2 : 1;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c] === opponent) return false;
      }
    }
    return true;
  }

  // ─────────────────────────────────────────
  //  RENDER
  // ─────────────────────────────────────────

  function pawnSVG(player) {
    const body   = player === 1 ? '#F8F9FA' : '#1a1a2e';
    const stroke = player === 1 ? '#999'    : '#555';
    return `
      <svg class="pawn" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- head -->
        <circle cx="50" cy="22" r="14" fill="${body}" stroke="${stroke}" stroke-width="3"/>
        <!-- neck -->
        <rect x="43" y="34" width="14" height="8" rx="2" fill="${body}" stroke="${stroke}" stroke-width="2"/>
        <!-- body -->
        <ellipse cx="50" cy="60" rx="20" ry="16" fill="${body}" stroke="${stroke}" stroke-width="3"/>
        <!-- base -->
        <rect x="28" y="74" width="44" height="10" rx="5" fill="${body}" stroke="${stroke}" stroke-width="3"/>
      </svg>`;
  }

  function renderBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';

    // Build sets for quick lookup
    const moveSet    = new Set(validMoves.filter(m => !m.capture).map(m => `${m.row},${m.col}`));
    const captureSet = new Set(validMoves.filter(m =>  m.capture).map(m => `${m.row},${m.col}`));

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        const isLight = (r + c) % 2 === 0;
        cell.className = `cell ${isLight ? 'light' : 'dark'}`;

        const key = `${r},${c}`;
        if (selected && selected.row === r && selected.col === c) {
          cell.classList.add('selected');
        } else if (moveSet.has(key)) {
          cell.classList.add('can-move');
        } else if (captureSet.has(key)) {
          cell.classList.add('can-capture');
        }

        const piece = board[r][c];
        if (piece !== 0) {
          cell.innerHTML = pawnSVG(piece);
        }

        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.addEventListener('click', onCellClick);
        boardEl.appendChild(cell);
      }
    }

    // Turn indicator
    const pip   = document.getElementById('turnPip');
    const label = document.getElementById('turnLabel');
    pip.style.background   = currentPlayer === 1 ? '#F8F9FA' : '#1a1a2e';
    pip.style.borderColor  = currentPlayer === 1 ? '#aaa' : '#555';
    label.textContent      = currentPlayer === 1 ? "White's Turn" : "Black's Turn";
  }

  function showWin(player) {
    gameOver = true;
    const overlay = document.getElementById('winOverlay');
    document.getElementById('winTitle').textContent = player === 1 ? 'White Wins!' : 'Black Wins!';
    overlay.classList.add('visible');
  }

  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  // ─────────────────────────────────────────
  //  INPUT
  // ─────────────────────────────────────────

  function onCellClick(e) {
    if (gameOver) return;

    const row = parseInt(e.currentTarget.dataset.row);
    const col = parseInt(e.currentTarget.dataset.col);
    const piece = board[row][col];

    // Clicked a valid move target
    const moveTarget = validMoves.find(m => m.row === row && m.col === col);
    if (moveTarget && selected) {
      // Execute move
      board[row][col] = board[selected.row][selected.col];
      board[selected.row][selected.col] = 0;

      selected   = null;
      validMoves = [];

      // Check win before switching player
      if (checkWin(currentPlayer)) {
        renderBoard();
        showWin(currentPlayer);
        return;
      }

      // Switch player
      currentPlayer = currentPlayer === 1 ? 2 : 1;

      // Check if new player has any moves (stalemate = other player wins)
      if (!hasAnyMove(currentPlayer)) {
        renderBoard();
        showWin(currentPlayer === 1 ? 2 : 1);
        return;
      }

      setStatus('Click a pawn to select it');
      renderBoard();
      return;
    }

    // Clicked own pawn — select it
    if (piece === currentPlayer) {
      selected   = { row, col };
      validMoves = getMovesForPawn(row, col, currentPlayer);
      if (validMoves.length === 0) {
        setStatus('This pawn has no valid moves');
      } else {
        setStatus(`${validMoves.length} move${validMoves.length > 1 ? 's' : ''} available`);
      }
      renderBoard();
      return;
    }

    // Clicked empty / opponent without selection — deselect
    selected   = null;
    validMoves = [];
    setStatus('Click a pawn to select it');
    renderBoard();
  }

  // ─────────────────────────────────────────
  //  INIT & CONTROLS
  // ─────────────────────────────────────────

  function startGame() {
    initBoard();
    document.getElementById('winOverlay').classList.remove('visible');
    setStatus('Click a pawn to select it');
    renderBoard();
  }

  document.getElementById('btnRestart').addEventListener('click', startGame);
  document.getElementById('btnPlayAgain').addEventListener('click', startGame);

  startGame();
</script>
</body>
</html>
